<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Розрахунок частоти процесора</title><style>*{box-sizing:border-box}body{font:18px system-ui;background:#eef2f7;color:#17253b;margin:0;padding:32px}main{max-width:850px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 8px 32px #142b5015}h1{font-size:32px}a{color:#245bb0}label{display:block;margin:18px 0 8px}input,select,button{font:inherit;padding:9px;border:1px solid #bac8d8;border-radius:8px}input[type=range]{width:100%;accent-color:#245bb0}button{cursor:pointer;background:#edf3ff;color:#17458c}output,.result{display:block;background:#eaf2ff;padding:20px;border-radius:12px;margin:20px 0;font-size:25px;font-weight:700}small{color:#52647a}li{margin:12px 0}svg{width:100%;height:auto} .item{display:flex;gap:8px;align-items:center;margin:10px 0}.item span{flex:1}</style><main><a href="../index.html">Каталог моделей</a><h1>Розрахунок частоти процесора</h1><label for="b">BCLK, МГц</label><input id="b" type="number" min="1" max="500" value="100"><label for="r">CPU Ratio: <strong id="ratio"></strong></label><input id="r" type="range" min="8" max="60" value="36"><output id="out"></output><button onclick="b.value=100;r.value=36;update()">Скинути</button><p><small>Математична модель: розрахована частота не гарантує стабільної роботи реального процесора.</small></p></main><script>const b=document.querySelector("#b"),r=document.querySelector("#r");function update(){ratio.textContent="×"+r.value;out.textContent= b.valueAsNumber>0 ? `${b.value} МГц × ${r.value} = ${(b.value*r.value/1000).toFixed(2)} ГГц` : "Введіть додатну частоту"} b.oninput=r.oninput=update;update();</script></html>

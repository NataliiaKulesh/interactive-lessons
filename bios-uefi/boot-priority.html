<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boot Priority</title><style>*{box-sizing:border-box}body{font:18px system-ui;background:#eef2f7;color:#17253b;margin:0;padding:32px}main{max-width:850px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 8px 32px #142b5015}h1{font-size:32px}a{color:#245bb0}label{display:block;margin:18px 0 8px}input,select,button{font:inherit;padding:9px;border:1px solid #bac8d8;border-radius:8px}input[type=range]{width:100%;accent-color:#245bb0}button{cursor:pointer;background:#edf3ff;color:#17458c}output,.result{display:block;background:#eaf2ff;padding:20px;border-radius:12px;margin:20px 0;font-size:25px;font-weight:700}small{color:#52647a}li{margin:12px 0}svg{width:100%;height:auto} .item{display:flex;gap:8px;align-items:center;margin:10px 0}.item span{flex:1}</style><main><a href="../index.html">Каталог моделей</a><h1>Boot Priority</h1><p>Змінюйте порядок джерел і позначайте ті, з яких можливе завантаження.</p><div id="items"></div><output id="out"></output><button onclick="reset()">Скинути</button><p><small>Спрощена модель: реальна поведінка залежить від прошивки та типу помилки завантаження.</small></p></main><script>let a;function reset(){a=[['USB-накопичувач',false],['Windows Boot Manager',true],['CD/DVD',false],['Мережа (PXE)',false]];draw()}function move(i,d){[a[i],a[i+d]]=[a[i+d],a[i]];draw()}function draw(){items.innerHTML=a.map(([n,v],i)=>`<div class="item"><span>${i+1}. ${n}</span><label style="margin:0"><input type="checkbox" ${v?'checked':''} onchange="a[${i}][1]=this.checked;draw()"> Доступне</label><button aria-label="Вище" ${i===0?'disabled':''} onclick="move(${i},-1)">↑</button><button aria-label="Нижче" ${i===a.length-1?'disabled':''} onclick="move(${i},1)">↓</button></div>`).join('');let j=a.findIndex(x=>x[1]);out.textContent=(j<0?'No Bootable Device':'Завантаження: '+a[j][0]);out.title=a.slice(0,j<0?a.length:j+1).map(x=>x[0]).join(' → ')}reset()</script></html>

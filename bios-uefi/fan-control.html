<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fan Control</title><style>*{box-sizing:border-box}body{font:18px system-ui;background:#eef2f7;color:#17253b;margin:0;padding:32px}main{max-width:850px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 8px 32px #142b5015}h1{font-size:32px}a{color:#245bb0}label{display:block;margin:18px 0 8px}input,select,button{font:inherit;padding:9px;border:1px solid #bac8d8;border-radius:8px}input[type=range]{width:100%;accent-color:#245bb0}button{cursor:pointer;background:#edf3ff;color:#17458c}output,.result{display:block;background:#eaf2ff;padding:20px;border-radius:12px;margin:20px 0;font-size:25px;font-weight:700}small{color:#52647a}li{margin:12px 0}svg{width:100%;height:auto} .item{display:flex;gap:8px;align-items:center;margin:10px 0}.item span{flex:1}</style><main><a href="../index.html">Каталог моделей</a><h1>Fan Control</h1><label for="mode">Профіль охолодження</label><select id="mode"><option>Silent</option><option selected>Standard</option><option>Performance</option><option>Full Speed</option></select><label for="temp">Температура: <strong id="t"></strong></label><input id="temp" type="range" min="30" max="80" value="60"><svg id="chart" viewBox="0 0 600 300" role="img" aria-label="Графік керувального рівня вентилятора"></svg><output id="out"></output><button onclick="mode.value='Standard';temp.value=60;update()">Скинути</button><p><small>Умовні навчальні криві. Відсоток керування не дорівнює відсотку фактичних обертів вентилятора.</small></p></main><script>const curves={Silent:[20,25,35,55,85,100],Standard:[30,40,55,75,95,100],Performance:[50,65,80,95,100,100],'Full Speed':[100,100,100,100,100,100]};const x=i=>55+i*100,y=v=>250-v*2;function update(){let n=+temp.value,i=Math.min(4,Math.floor((n-30)/10)),c=curves[mode.value],v=c[i]+(c[i+1]-c[i])*(n-30-i*10)/10;t.textContent=n+' °C';out.textContent='Керувальний рівень: '+Math.round(v)+'%';chart.innerHTML=[0,25,50,75,100].map(k=>`<line x1="55" x2="555" y1="${y(k)}" y2="${y(k)}" stroke="#d4dce7"/><text x="48" y="${y(k)+5}" text-anchor="end" font-size="13">${k}%</text>`).join('')+Array.from({length:6},(_,j)=>`<text x="${x(j)}" y="275" text-anchor="middle" font-size="13">${30+j*10}°C</text>`).join('')+Object.entries(curves).map(([name,vals])=>`<polyline fill="none" stroke="${name===mode.value?'#245bb0':'#c3cbd6'}" stroke-width="${name===mode.value?4:2}" points="${vals.map((k,j)=>x(j)+','+y(k)).join(' ')}"/>`).join('')+`<circle cx="${55+(n-30)*10}" cy="${y(v)}" r="7" fill="#e07820"/>`}mode.onchange=temp.oninput=update;update()</script></html>

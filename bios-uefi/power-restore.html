<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restore on AC Power Loss</title><style>*{box-sizing:border-box}body{font:18px system-ui;background:#eef2f7;color:#17253b;margin:0;padding:32px}main{max-width:850px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 8px 32px #142b5015}h1{font-size:32px}a{color:#245bb0}label{display:block;margin:18px 0 8px}input,select,button{font:inherit;padding:9px;border:1px solid #bac8d8;border-radius:8px}input[type=range]{width:100%;accent-color:#245bb0}button{cursor:pointer;background:#edf3ff;color:#17458c}output,.result{display:block;background:#eaf2ff;padding:20px;border-radius:12px;margin:20px 0;font-size:25px;font-weight:700}small{color:#52647a}li{margin:12px 0}svg{width:100%;height:auto} .item{display:flex;gap:8px;align-items:center;margin:10px 0}.item span{flex:1}</style><main><a href="../index.html">Каталог моделей</a><h1>Restore on AC Power Loss</h1><label for="prev">Стан до зникнення живлення</label><select id="prev"><option value="on">Увімкнений</option><option value="off">Вимкнений</option></select><label for="mode">Параметр UEFI</label><select id="mode"><option>Power On</option><option>Power Off</option><option selected>Last State</option></select><p>Зникнення живлення → відновлення живлення</p><output id="out"></output><button onclick="prev.value='on';mode.value='Last State';update()">Скинути</button><p><small>Last State відновлює стан живлення, а не вміст RAM чи відкриті програми.</small></p></main><script>function update(){out.textContent=mode.value==="Power On"||(mode.value==="Last State"&&prev.value==="on")?"ПК автоматично ввімкнеться":"ПК залишиться вимкненим"}prev.onchange=mode.onchange=update;update()</script></html>
